[workspace]
name = "oc-pixi"
version = "1.0.1"
description = "Pixi for OpenCode agents"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
nodejs = "24.*"

[tasks]
deps = "node scripts/deps.mjs"
deps-update = "node scripts/deps.mjs --refresh --shrinkwrap"
check = { cmd = "npm run check", depends-on = ["deps"] }
build = { cmd = "npm run build", depends-on = ["deps"] }
test = { cmd = "npm test", depends-on = ["check", "build"] }
bundle-docs = "node scripts/docs.mjs"
install = { cmd = "node scripts/install.mjs", depends-on = ["build", "test"] }
install-dev = { cmd = "node scripts/install.mjs --dev", depends-on = ["build"] }
uninstall = { cmd = "node scripts/install.mjs --uninstall", depends-on = ["deps"] }
rollback = { cmd = "node scripts/install.mjs --rollback", depends-on = ["deps"] }
install-status = { cmd = "node scripts/install.mjs --status", depends-on = ["deps"] }
smoke-host = { cmd = "node --import tsx scripts/smoke-host.mjs", depends-on = ["build"] }
smoke-snapshot = { cmd = "node --import tsx scripts/smoke-host.mjs --snapshot", depends-on = ["build"] }
desktop-dev = { cmd = "node --import tsx scripts/desktop-dev.mjs", depends-on = ["build"] }
